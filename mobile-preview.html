<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citident Mobile Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #0ea5e9;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #0d9488 100%);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Abstract mesh backgrounds */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            filter: blur(50px);
        }

        header {
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title-badge {
            background: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(14, 165, 233, 0.3);
        }

        .preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            position: relative;
        }

        /* Mockup Device Styling (iPhone 15 Pro-like) */
        .device {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 
                        0 0 0 12px #1f2937, 
                        0 0 0 13px rgba(255,255,255,0.1),
                        0 0 40px rgba(14, 165, 233, 0.15);
            overflow: hidden;
            position: relative;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.95);
        }

        @media (max-height: 900px) {
            .device {
                transform: scale(0.8);
            }
        }
        @media (max-height: 750px) {
            .device {
                transform: scale(0.68);
            }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Dynamic Island / Notch */
        .camera-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            pointer-events: none;
            z-index: 999;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
        }

        .camera-lens {
            width: 8px;
            height: 8px;
            background: #111827;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.4);
        }

        /* iOS Home Indicator */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <header>
        <a href="./index.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Portal
        </a>
        <div class="header-title">
            Mobile Device Viewport
            <span class="header-title-badge">iPhone 15 Pro</span>
        </div>
        <div class="actions">
            <a href="./artifacts/citident/dist/public/index.html" class="action-btn">Open Fullscreen Desktop</a>
        </div>
    </header>

    <div class="preview-area">
        <div class="device">
            <div class="camera-notch">
                <span class="camera-lens"></span>
            </div>
            <iframe src="./artifacts/citident/dist/public/"></iframe>
            <div class="home-indicator"></div>
        </div>
    </div>
</body>
</html>
